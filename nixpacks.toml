# Nixpacks config for Railway — installs system deps Puppeteer/Chrome needs.
# https://nixpacks.com/docs/configuration/file

[phases.setup]
# libnss3, libnspr4, libatk1.0-0, libatk-bridge2.0-0, libcups2, libdrm2, libxkbcommon0,
# libxcomposite1, libxdamage1, libxfixes3, libxrandr2, libgbm1, libasound2 — Chrome deps.
# fonts-liberation — needed so Chromium renders text properly.
# Also installs Noto Sans for font fallback (Inter / Fraunces load from Google Fonts at runtime).
aptPkgs = [
  "ca-certificates",
  "chromium",
  "fonts-liberation",
  "fonts-noto-color-emoji",
  "libasound2",
  "libatk-bridge2.0-0",
  "libatk1.0-0",
  "libcairo2",
  "libcups2",
  "libdbus-1-3",
  "libdrm2",
  "libexpat1",
  "libgbm1",
  "libglib2.0-0",
  "libgtk-3-0",
  "libnss3",
  "libnspr4",
  "libpango-1.0-0",
  "libx11-6",
  "libx11-xcb1",
  "libxcb1",
  "libxcomposite1",
  "libxcursor1",
  "libxdamage1",
  "libxext6",
  "libxfixes3",
  "libxi6",
  "libxrandr2",
  "libxrender1",
  "libxss1",
  "libxtst6",
  "lsb-release",
  "wget",
  "xdg-utils",
]

[phases.install]
# Install deps. The postinstall hook tries to download Chrome but may fail
# in restricted environments — the || ensures the build continues.
# Chrome will be found at runtime via PUPPETEER_EXECUTABLE_PATH or system path.
cmds = ["npm install --legacy-peer-deps"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "HOSTNAME=0.0.0.0 PORT=${PORT:-8080} NODE_ENV=production node .next/standalone/server.js"
